{% extends 'base.html' %}

{% block title %}Chat with {{ assistant.name }}{% endblock %}

{% block content %}
    <h1>Chat with {{ assistant.name }}</h1>
    <div id="chat-box" class="card" style="height: 400px; overflow-y: scroll;">
        <div class="card-body">
            <!-- Messages will be appended here -->
        </div>
    </div>
    <form id="chat-form" class="mt-3">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" id="message-input" class="form-control" placeholder="Type your message...">
            <button type="submit" class="btn btn-primary">Send</button>
        </div>
    </form>

    <script>
        document.getElementById('chat-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value;
            messageInput.value = '';

            const chatBox = document.getElementById('chat-box').querySelector('.card-body');
            chatBox.innerHTML += `<p><strong>You:</strong> ${message}</p>`;

            fetch("{% url 'chat' assistant.id %}", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `message=${encodeURIComponent(message)}`
            })
            .then(response => response.json())
            .then(data => {
                chatBox.innerHTML += `<p><strong>{{ assistant.name }}:</strong> ${data.response}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        });
    </script>
{% endblock %}
